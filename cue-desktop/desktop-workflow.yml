name: Desktop app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["cue-desktop/**", "index.html", ".github/workflows/desktop.yml"]
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: cue-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Bundle the web app
        shell: bash
        run: |
          mkdir -p app
          cp ../index.html ../manifest.webmanifest ../icon.svg ../icon-192.png ../icon-512.png app/
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb > /dev/null
          xvfb-run -a npx electron . --smoke --no-sandbox
      - name: Build installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Cue-${{ runner.os }}
          path: |
            cue-desktop/dist/*.dmg
            cue-desktop/dist/*.exe
            cue-desktop/dist/*.AppImage
          if-no-files-found: error
          retention-days: 14
